name: UI Preview
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/SkyPilot.App -c Release
      - name: Render previews
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "previews"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem -Recurse -Filter SkyPilot.exe | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Exe: $exe"
          Write-Host "Output: $out"
          # Use Start-Process -Wait so PowerShell waits for the WPF (WinExe) app to exit.
          $proc = Start-Process -FilePath $exe -ArgumentList "--render-previews", $out -Wait -PassThru -WindowStyle Minimized
          $code = $proc.ExitCode
          Write-Host "Exit code: $code"
          Get-ChildItem $out -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  PNG: $_" }
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: previews/
          if-no-files-found: warn
